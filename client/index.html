<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      // 最早期拦截 ResizeObserver loop 良性告警（浏览器在元素尺寸于同一帧内连续
      // 变化时触发，常见于 Radix UI / 表格组件，不影响功能）。内联于 head 顶部并
      // 使用 capture 阶段，确保早于 debug-collector 等错误监控注册，避免误报。
      window.addEventListener(
        "error",
        function (e) {
          if (
            e.message === "ResizeObserver loop completed with undelivered notifications." ||
            e.message === "ResizeObserver loop limit exceeded"
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true
      );
    </script>
    <title>51电子网 - 后台管理系统</title>
    <meta name="description" content="51电子网电商平台后台管理系统" />
    <!--
      浏览器标签页图标。图标文件位于 client/public/，
      由 Vite 原样复制到产物根目录，因此必须用根绝对路径引用：
      后台存在 /messages、/merchants 等多级路由，
      相对路径会被解析到错误位置而 404。

      图标与前台（dianzi51-platform）使用同一套文件，
      同为「51」品牌标志，便于用户在多标签页中识别本平台。
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
