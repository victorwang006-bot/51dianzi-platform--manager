name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - chore/health-remediation-20261028

permissions:
  contents: read

jobs:
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify installed dependency patch
        run: node scripts/verify-dependency-patch.mjs

      - name: Type check
        run: pnpm check

      - name: Build and verify /admin/
        run: |
          pnpm build:admin
          pnpm verify:admin-build

      - name: Build and verify subdomain root
        run: |
          pnpm build:subdomain
          pnpm verify:subdomain-build

      - name: Run allowlisted unit tests
        run: pnpm test:unit

      - name: Lint remediation governance files
        run: pnpm lint

      - name: Run production-audit regression
        run: python3 scripts/production-audit.test.py
